# Power-supply sheet, included from board.yaml. Defines one sheet
# (`power`) with a regulator + bypass caps; the parent file's root:
# instantiates it.

sheets:
  power:
    components:
      - ref: U1
        symbol: Device:Regulator_3V3
        footprint: Device:SOT-23-3
        value: "AP2112K-3.3"
        pins:
          VIN:  VBUS_5V_U1_1
          VOUT: VCC_3V3
      - ref: C_IN
        symbol: Device:C
        footprint: Device:C_0805_2012Metric
        value: "10uF"
        pins: { 1: VBUS_5V_U1_1, 2: GND }
      - ref: C_OUT
        symbol: Device:C
        footprint: Device:C_0805_2012Metric
        value: "10uF"
        pins: { 1: VCC_3V3, 2: GND }
